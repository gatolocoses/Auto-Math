name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: node --test
      - name: Verify manifest versions match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CHROME=$(node -p "require('./manifest.json').version")
          FIREFOX=$(node -p "require('./manifest.firefox.json').version")
          if [ "$CHROME" != "$TAG" ] || [ "$FIREFOX" != "$TAG" ]; then
            echo "Manifest versions (chrome: $CHROME, firefox: $FIREFOX) do not match tag $GITHUB_REF_NAME."
            echo "Bump the version in both manifest.json and manifest.firefox.json before tagging."
            exit 1
          fi
      - name: Package Chrome and Firefox builds
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          mkdir -p dist-chrome dist-firefox
          cp manifest.json background.js content.js math.js dist-chrome/
          cp background.js content.js math.js dist-firefox/
          cp manifest.firefox.json dist-firefox/manifest.json
          (cd dist-chrome && zip -r "../inline-math-evaluator-v${VERSION}-chrome.zip" .)
          (cd dist-firefox && zip -r "../inline-math-evaluator-v${VERSION}-firefox.zip" .)
          cp "inline-math-evaluator-v${VERSION}-firefox.zip" "inline-math-evaluator-v${VERSION}-firefox.xpi"
      - name: Create GitHub release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            inline-math-evaluator-v*-chrome.zip
            inline-math-evaluator-v*-firefox.zip
            inline-math-evaluator-v*-firefox.xpi
          generate_release_notes: true
